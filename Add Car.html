<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Admin - Bright UI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

/* ===================== */
/* 🌈 亮色科技蓝背景（关键恢复） */
/* ===================== */
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    /* ⭐恢复你最初“干净科技蓝” */
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);

    overflow:hidden;
}

/* 柔光（变轻，不压暗） */
body::before{
    content:"";
    position:absolute;
    width:650px;
    height:650px;

    background: radial-gradient(circle, rgba(0,198,255,0.25), transparent 60%);

    top:-120px;
    left:-120px;

    filter: blur(60px);
}

/* ===================== */
/* 📦 容器（更亮玻璃） */
/* ===================== */
.container{
    width:980px;
    display:flex;
    border-radius:22px;
    overflow:hidden;

    /* ⭐变亮关键 */
    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(18px);

    box-shadow:0 25px 60px rgba(0,0,0,0.35);
}

/* ===================== */
/* 🚗 左侧（清爽居中） */
/* ===================== */
.left{
    width:45%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:40px;

    background:rgba(255,255,255,0.08);

    border-right:1px solid rgba(255,255,255,0.18);
}

.left h2{
    color:#fff;
    font-weight:400;
    margin-bottom:15px;
    letter-spacing:1px;
}

/* 图片框 */
.preview-box{
    width:100%;
    height:250px;

    border-radius:18px;

    border:2px dashed rgba(255,255,255,0.35);

    background:rgba(255,255,255,0.10);

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    margin:15px 0;

    transition:0.3s;
}

.preview-box:hover{
    transform:scale(1.02);
    box-shadow:0 15px 30px rgba(0,0,0,0.2);
}

.preview-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* 上传按钮 */
.upload-btn{
    padding:10px 18px;
    border:none;
    border-radius:10px;

    background:rgba(255,255,255,0.2);
    color:#fff;

    cursor:pointer;

    transition:0.3s;
}

.upload-btn:hover{
    background:rgba(255,255,255,0.35);
    transform:translateY(-2px);
}

/* ===================== */
/* 🧾 右侧（亮色UI） */
/* ===================== */
.right{
    width:55%;
    padding:45px;
}

.right h2{
    color:#fff;
    margin-bottom:15px;
}

/* 进度条 */
.progress{
    height:8px;
    background:rgba(255,255,255,0.2);
    border-radius:10px;
    margin-bottom:18px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(135deg,#00c6ff,#00ffae);
    border-radius:10px;
    transition:0.3s;
}

/* 表单 */
.form-group{
    margin-bottom:14px;
}

label{
    color:#eee;
    font-size:13px;
}

/* ⭐变亮输入框 */
input,select,textarea{
    width:100%;
    padding:11px;

    margin-top:5px;

    border-radius:10px;

    border:none;

    outline:none;

    background:rgba(255,255,255,0.18);

    color:#fff;
}

/* focus */
input:focus,select:focus,textarea:focus{
    box-shadow:0 0 12px rgba(0,198,255,0.4);
}

/* select修复 */
select option{
    color:#000;
    background:#fff;
}

/* 状态 */
.valid{border:1px solid #00ffae;}
.invalid{border:1px solid #ff6b6b;}

.error{
    font-size:12px;
    color:#ff6b6b;
    display:none;
}

/* ===================== */
/* 🚀 按钮（亮色科技风） */
/* ===================== */
button{
    width:100%;
    padding:13px;
    margin-top:15px;

    border:none;
    border-radius:12px;

    background:linear-gradient(135deg,#00c6ff,#0072ff);

    color:#fff;

    cursor:pointer;

    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(0,0,0,0.25);
}

/* ===================== */
/* 📱 响应式 */
/* ===================== */
@media(max-width:1024px){
    .container{
        flex-direction:column;
        width:90%;
    }
    .left,.right{
        width:100%;
    }
}

@media(max-width:600px){
    .right,.left{
        padding:20px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- 左 -->
    <div class="left">
        <h2>Car Preview</h2>

        <div class="preview-box" id="previewBox">
            <span style="color:#ddd;">No Image</span>
        </div>

        <input type="file" id="imageUpload" hidden>
        <button class="upload-btn" onclick="imageUpload.click()">Upload Image</button>
    </div>

    <!-- 右 -->
    <div class="right">

        <h2>Add New Car</h2>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <form id="carForm" autocomplete="off">

            <div class="form-group">
                <label>Car Name</label>
                <input type="text" id="name">
                <div class="error">2-30 letters only</div>
            </div>

            <div class="form-group">
                <label>Brand</label>
                <input type="text" id="brand">
                <div class="error">Only letters allowed</div>
            </div>

            <div class="form-group">
                <label>Price</label>
                <input type="text" id="price">
                <div class="error">Invalid price</div>
            </div>

            <div class="form-group">
                <label>Year</label>
                <input type="text" id="year">
                <div class="error">1900-2099 only</div>
            </div>

            <div class="form-group">
                <label>Fuel Type</label>
                <select>
                    <option>Petrol</option>
                    <option>Electric</option>
                    <option>Hybrid</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea rows="3"></textarea>
            </div>

            <button type="submit">Add Car</button>

        </form>
    </div>

</div>

<script>

// ===== Toast =====
function showToast(){
    alert("Car added successfully");
}

// ===== 正则 =====
const patterns={
    name:/^[A-Za-z\s]{2,30}$/,
    brand:/^[A-Za-z\s]{2,20}$/,
    price:/^\d+(\.\d{1,2})?$/,
    year:/^(19|20)\d{2}$/
};

// ===== 校验 =====
function validate(input,pattern){
    const error=input.nextElementSibling;

    if(pattern.test(input.value)){
        input.classList.add("valid");
        input.classList.remove("invalid");
        error.style.display="none";
        return true;
    }else{
        input.classList.add("invalid");
        input.classList.remove("valid");
        error.style.display="block";
        return false;
    }
}

// ===== 进度条 =====
function updateProgress(){
    let total=Object.keys(patterns).length;
    let ok=0;

    for(let k in patterns){
        const input=document.getElementById(k);
        if(patterns[k].test(input.value)) ok++;
    }

    document.getElementById("progressBar").style.width=(ok/total*100)+"%";
}

// 输入监听
document.querySelectorAll("input").forEach(i=>{
    i.addEventListener("input",()=>{
        if(patterns[i.id]){
            validate(i,patterns[i.id]);
            updateProgress();
        }
    });
});

// 提交
document.getElementById("carForm").addEventListener("submit",e=>{
    e.preventDefault();

    let ok=true;

    for(let k in patterns){
        const input=document.getElementById(k);
        if(!validate(input,patterns[k])) ok=false;
    }

    if(ok) showToast();
});

// 图片预览
imageUpload.addEventListener("change",e=>{
    const file=e.target.files[0];
    if(file){
        const reader=new FileReader();
        reader.onload=e=>{
            previewBox.innerHTML=`<img src="${e.target.result}">`;
        }
        reader.readAsDataURL(file);
    }
});

</script>

</body>
</html>
