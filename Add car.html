<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Admin - Bright UI</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins",sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            overflow: hidden;
            padding-top: 80px;
        }

            body::before {
                content: "";
                position: absolute;
                width: 650px;
                height: 650px;
                background: radial-gradient(circle, rgba(0,198,255,0.25), transparent 60%);
                top: -120px;
                left: -120px;
                filter: blur(60px);
            }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.15);
            z-index: 999;
        }

            .navbar::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: -100%;
                width: 100%;
                height: 2px;
                background: linear-gradient(90deg,transparent,#00c6ff,#00ffae,transparent);
                animation: flow 6s linear infinite;
            }

        @keyframes flow {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .nav {
            display: flex;
            gap: 35px;
        }

            .nav a {
                color: #ddd;
                text-decoration: none;
                font-size: 15px;
                position: relative;
                padding: 6px 4px;
                transition: 0.35s;
            }

                .nav a::before {
                    content: "";
                    position: absolute;
                    left: 0;
                    bottom: -6px;
                    width: 0%;
                    height: 2px;
                    background: linear-gradient(135deg,#00c6ff,#00ffae);
                    transition: 0.35s;
                    border-radius: 10px;
                }

                .nav a:hover {
                    color: #fff;
                    transform: translateY(-1px);
                    text-shadow: 0 0 6px rgba(0,198,255,0.5);
                }

                    .nav a:hover::before {
                        width: 100%;
                    }

                .nav a.active {
                    color: #00c6ff;
                }

                    .nav a.active::before {
                        width: 100%;
                        height: 3px;
                    }

        .container {
            width: 980px;
            display: flex;
            border-radius: 22px;
            overflow: hidden;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.35);
        }

        .left {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: rgba(255,255,255,0.08);
            border-right: 1px solid rgba(255,255,255,0.18);
        }

            .left h2 {
                color: #fff;
                margin-bottom: 15px;
            }

        .preview-box {
            width: 100%;
            height: 250px;
            border-radius: 18px;
            border: 2px dashed rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.10);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin: 15px 0;
            transition: 0.3s;
        }

            .preview-box:hover {
                transform: scale(1.02);
                box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            }

            .preview-box img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

        .upload-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

            .upload-btn:hover {
                background: rgba(255,255,255,0.35);
            }

        .right {
            width: 55%;
            padding: 45px;
        }

            .right h2 {
                color: #fff;
                margin-bottom: 15px;
            }

        .progress {
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin-bottom: 18px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(270deg,#00c6ff,#00ffae,#00c6ff);
            background-size: 200% 100%;
            border-radius: 10px;
            animation: move 3s linear infinite;
        }

        @keyframes move {
            0% {
                background-position: 0%
            }

            100% {
                background-position: 200%
            }
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            color: #eee;
            font-size: 13px;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            margin-top: 5px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.18);
            color: #fff;
        }

            input:focus, select:focus, textarea:focus {
                box-shadow: 0 0 12px rgba(0,198,255,0.4);
            }

            select option {
                color: #000;
                background: #fff;
            }

        .valid {
            border: 1px solid #00ffae;
        }

        .invalid {
            border: 1px solid #ff6b6b;
        }

        .error {
            font-size: 12px;
            color: #ff6b6b;
            display: none;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg,#00c6ff,#0072ff);
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 25px rgba(0,0,0,0.25);
            }

        .toast {
            position: fixed;
            top: 90px;
            right: 30px;
            min-width: 240px;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(20,20,20,0.75);
            color: #fff;
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 35px rgba(0,0,0,0.45);
            opacity: 0;
            transform: translateY(-20px) scale(0.9);
            transition: 0.4s;
            z-index: 1000;
        }

            .toast.show {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            .toast.success {
                border-left: 4px solid #00ffae;
            }

            .toast.error {
                border-left: 4px solid #ff6b6b;
            }

            .toast.success {
                box-shadow: 0 0 15px rgba(0,255,174,0.3);
            }

            .toast.error {
                box-shadow: 0 0 15px rgba(255,107,107,0.3);
            }

        @media(max-width:1024px) {
            .container {
                flex-direction: column;
                width: 90%;
            }

            .left, .right {
                width: 100%;
            }
        }

        @media(max-width:600px) {
            .right, .left {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div class="nav">
            <a href="Homepage_AI.html.html">Homepage</a>
            <a href="Login.html">Login</a>
            <a href="Registration.html">Registration</a>
            <a href="Search Page.html">Search</a>
            <a href="Add car.html" class="active">Add Car</a>
        </div>
    </div>

    <div class="container">

        <div class="left">
            <h2>Car Preview</h2>

            <div class="preview-box" id="previewBox">
                <span style="color:#ddd;">No Image</span>
            </div>

            <input type="file" id="imageUpload" hidden>
            <button class="upload-btn" onclick="imageUpload.click()">Upload Image</button>
        </div>

        <div class="right">

            <h2>Add New Car</h2>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <form id="carForm" autocomplete="off">

                <div class="form-group">
                    <label>Car Name</label>
                    <input type="text" id="name">
                    <div class="error">2-30 letters only</div>
                </div>

                <div class="form-group">
                    <label>Brand</label>
                    <input type="text" id="brand">
                    <div class="error">Only letters allowed</div>
                </div>

                <div class="form-group">
                    <label>Price</label>
                    <input type="text" id="price">
                    <div class="error">Invalid price</div>
                </div>

                <div class="form-group">
                    <label>Year</label>
                    <input type="text" id="year">
                    <div class="error">1900-2099 only</div>
                </div>

                <div class="form-group">
                    <label>Fuel Type</label>
                    <select>
                        <option>Petrol</option>
                        <option>Electric</option>
                        <option>Hybrid</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
<textarea rows="3"></textarea>
                </div>

                <button type="submit">Add Car</button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>

        function showToast(msg, type = "success") {
            const t = document.getElementById("toast");
            t.className = "toast show " + type;
            const icon = type === "success" ? "✔️" : "⚠️";
            t.innerHTML = `${icon} ${msg}`;
            setTimeout(() => { t.classList.remove("show"); }, 2600);
        }

        const patterns = {
            name: /^[A-Za-z\s]{2,30}$/,
            brand: /^[A-Za-z\s]{2,20}$/,
            price: /^\d+(\.\d{1,2})?$/,
            year: /^(19|20)\d{2}$/
        };

        function validate(input, pattern) {
            const error = input.nextElementSibling;
            if (pattern.test(input.value)) {
                input.classList.add("valid");
                input.classList.remove("invalid");
                error.style.display = "none";
                return true;
            } else {
                input.classList.add("invalid");
                input.classList.remove("valid");
                error.style.display = "block";
                return false;
            }
        }

        function updateProgress() {
            let total = Object.keys(patterns).length;
            let ok = 0;
            for (let k in patterns) {
                if (patterns[k].test(document.getElementById(k).value)) ok++;
            }
            progressBar.style.width = (ok / total * 100) + "%";
        }

        document.querySelectorAll("input").forEach(i => {
            i.addEventListener("input", () => {
                if (patterns[i.id]) {
                    validate(i, patterns[i.id]);
                    updateProgress();
                }
            });
        });

        carForm.addEventListener("submit", e => {
            e.preventDefault();
            let ok = true;
            for (let k in patterns) {
                if (!validate(document.getElementById(k), patterns[k])) ok = false;
            }
            if (ok) {
                showToast("Car added successfully", "success");
            } else {
                showToast("Please fix form errors", "error");
            }
        });

        imageUpload.addEventListener("change", e => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    previewBox.innerHTML = `<img src="${e.target.result}">`;
                }
                reader.readAsDataURL(file);
            }
        });

    </script>

</body>
</html>
